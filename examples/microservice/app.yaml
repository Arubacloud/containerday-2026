apiVersion: platform.example.com/v1alpha1
kind: Microservice
metadata:
  name: containerday-microsvc
  namespace: default
spec:
  # adminer is a lightweight MySQL web admin UI.
  # Once Ready=True, open http://<status.endpoint> in your browser.
  # Log in with: server=<auto-filled>, user=appuser, password=<from my-svc-db-conn secret>, database=app
  image: adminer:4.8.1
  port: 8080
  database:
    engine: mysql
  writeConnectionSecretToRef:
    name: containerday-microsvc-db-conn
    namespace: default
