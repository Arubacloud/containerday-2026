name: Build and push Configuration package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'apis/**'
      - 'functions/appenv-deployer/**'
      - 'crossplane-project.yaml'
      - 'schemas/.lock.json'
      - '.github/workflows/configuration.yaml'
  pull_request:
    paths:
      - 'apis/**'
      - 'functions/appenv-deployer/**'
      - 'crossplane-project.yaml'
      - 'schemas/.lock.json'
      - '.github/workflows/configuration.yaml'

env:
  # OCI repository — must match spec.repository in crossplane-project.yaml.
  # crossplane project build/push maps github.com/<org>/<repo> → ghcr.io/<org>/<repo>.
  REPOSITORY: ghcr.io/arubacloud/containerday-2026

jobs:
  test:
    name: Test function
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/appenv-deployer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: functions/appenv-deployer/go.mod
          cache-dependency-path: functions/appenv-deployer/go.sum

      - name: Run tests
        run: go test ./... -v -race -count=1

  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane xpkg --help

      # Cache the crossplane dependency packages between runs.
      # Key is the lock file — if it changes (new/updated dependency), the cache is invalidated.
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: ~/.crossplane/cache
          key: crossplane-deps-${{ hashFiles('schemas/.lock.json') }}
          restore-keys: crossplane-deps-

      # Populate the cache if it was a miss or the lock file changed.
      # This resolves versions, downloads all dependency packages, and regenerates schemas.
      - name: Update dependency cache
        run: crossplane dependency update-cache --cache-dir="${HOME}/.crossplane/cache"

      # Determine the package tag.
      # v* git tag  → use the tag name as-is (e.g. v1.0.0)
      # main branch → use "latest"
      - name: Resolve package tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=latest" >> "$GITHUB_OUTPUT"
          fi

      # crossplane project build:
      # - builds the embedded function-appenv-deployer from functions/appenv-deployer/
      # - bundles XRDs + Compositions into a Configuration xpkg
      # - rewrites functionRefs in Compositions to point to the correct registry paths
      # Output: _output/containerday-2026.xpkg
      - name: Build Configuration package
        run: |
          crossplane project build \
            --cache-dir="${HOME}/.crossplane/cache" \
            --repository="${REPOSITORY}"

      # crossplane project push:
      # - pushes the Configuration package:  ghcr.io/arubacloud/containerday-2026:<tag>
      # - pushes the embedded function:      ghcr.io/arubacloud/containerday-2026/function-appenv-deployer:<tag>
      - name: Push Configuration package
        run: |
          crossplane project push \
            --repository="${REPOSITORY}" \
            --tag="${{ steps.tag.outputs.value }}"

      - name: Print pushed images
        run: |
          echo "Configuration : ${REPOSITORY}:${{ steps.tag.outputs.value }}"
          echo "Function      : ${REPOSITORY}/function-appenv-deployer:${{ steps.tag.outputs.value }}"
