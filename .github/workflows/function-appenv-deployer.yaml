name: Build and push function-appenv-deployer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'functions/appenv-deployer/**'
      - '.github/workflows/function-appenv-deployer.yaml'
  pull_request:
    paths:
      - 'functions/appenv-deployer/**'
      - '.github/workflows/function-appenv-deployer.yaml'

env:
  IMAGE: ghcr.io/arubacloud/function-appenv-deployer

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/appenv-deployer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: functions/appenv-deployer/go.mod
          cache-dependency-path: functions/appenv-deployer/go.sum

      - name: Run tests
        run: go test ./... -v -race -count=1

  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: functions/appenv-deployer/go.mod
          cache-dependency-path: functions/appenv-deployer/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short

      # Build the runtime image locally (not pushed yet — it gets embedded in the xpkg)
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: functions/appenv-deployer
          load: true
          tags: function-appenv-deployer-runtime:local
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache,ignore-error=true
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false

      - name: Install crossplane CLI
        run: |
          curl -sL "https://raw.githubusercontent.com/crossplane/crossplane/master/install.sh" | sh
          sudo mv crossplane /usr/local/bin/crossplane
          crossplane xpkg --help

      # crossplane xpkg build creates a proper Crossplane package OCI artifact
      # by reading crossplane.yaml and embedding the runtime image.
      - name: Build xpkg
        run: |
          crossplane xpkg build \
            --package-root functions/appenv-deployer \
            --embed-runtime-image function-appenv-deployer-runtime:local \
            -o /tmp/function-appenv-deployer.xpkg

      # Push the xpkg with every tag produced by the metadata step.
      - name: Push xpkg
        run: |
          for TAG in ${{ steps.meta.outputs.tags }}; do
            echo "Pushing $TAG"
            crossplane xpkg push \
              --package-files /tmp/function-appenv-deployer.xpkg \
              "$TAG"
          done

      - name: Print pushed tags
        run: echo "${{ steps.meta.outputs.tags }}"
