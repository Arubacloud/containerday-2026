name: Build and push function-appenv-deployer

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'functions/appenv-deployer/**'
      - '.github/workflows/function-appenv-deployer.yaml'
  pull_request:
    paths:
      - 'functions/appenv-deployer/**'
      - '.github/workflows/function-appenv-deployer.yaml'

env:
  IMAGE: ghcr.io/arubacloud/function-appenv-deployer

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions/appenv-deployer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: functions/appenv-deployer/go.mod
          cache-dependency-path: functions/appenv-deployer/go.sum

      - name: Run tests
        run: go test ./... -v -race -count=1

  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    needs: test
    # Only push on main branch pushes and version tags, not on PRs.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            # main branch → :latest
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            # version tags (v1.2.3) → :1.2.3 and :1.2 and :1
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # short SHA for traceability
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: functions/appenv-deployer
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs using the registry itself.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache,ignore-error=true
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
          provenance: false

      - name: Print image digest
        run: echo "Pushed ${{ env.IMAGE }} — digest ${{ steps.build-push.outputs.digest }}"
